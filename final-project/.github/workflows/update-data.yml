name: 更新資料
on:
  schedule:
    - cron: "30 7 * * 1-5"    # 台灣時間平日 15:30 (收盤後)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_*.py", "scripts/finmind.py", ".github/workflows/update-data.yml", "data/etfs.json", "data/holdings.json", "data/companies.json"]
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance requests numpy pydantic fastapi faiss-cpu
      - name: 當日行情 (證交所、櫃買)
        run: python scripts/fetch_daily.py
        continue-on-error: true
      - name: 歷史價格 (FinMind，失敗時用 Yahoo Finance)
        run: python scripts/fetch_prices.py
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: 配息 (FinMind)
        run: python scripts/fetch_dividends.py
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: 前端資料
        run: python scripts/build_site_data.py
        continue-on-error: true
      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/data
          git diff --cached --quiet || git commit -m "資料更新 $(date -u +%F)"
          git pull --rebase --autostash
          git push
