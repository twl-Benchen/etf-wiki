<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ETF 都會</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* Layout: full-bleed 3D city; conversation dock on the right (bottom sheet on phones) drives the camera; small brand chip top-left */
:root {
  --bg: #0d1522;
  --panel: rgba(248, 250, 252, 0.9);
  --panel-solid: #f8fafc;
  --ink: #142030;
  --muted: #5a6879;
  --hair: rgba(20, 32, 48, 0.12);
  --chip: #e9eef5;
  --bubble: #1f6fd6;
  --bubble-ink: #ffffff;
  --focus: #1f6fd6;
  --up: #d63a3a;
  --down: #12905a;
  --gold: #b88407;
  --code-bg: #eef2f7;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-head: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(15, 21, 30, 0.9); --panel-solid: #0f151e; --ink: #e6ebf2; --muted: #98a5b5;
    --hair: rgba(230, 235, 242, 0.14); --chip: #1c2633; --bubble: #3b82f6; --focus: #6aa8ff;
    --up: #ff6b6b; --down: #3fd391; --gold: #f0c24a; --code-bg: #18212d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: rgba(15, 21, 30, 0.9); --panel-solid: #0f151e; --ink: #e6ebf2; --muted: #98a5b5;
  --hair: rgba(230, 235, 242, 0.14); --chip: #1c2633; --bubble: #3b82f6; --focus: #6aa8ff;
  --up: #ff6b6b; --down: #3fd391; --gold: #f0c24a; --code-bg: #18212d;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
#sky { position: fixed; inset: 0; }
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; }
.panel {
  background: var(--panel); color: var(--ink);
  backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border: 1px solid var(--hair); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.18);
}
.up { color: var(--up); } .down { color: var(--down); }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* brand chip + settings */
#brand { position: fixed; z-index: 5; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; }
#brand h1 { margin: 0; font-family: var(--font-head); font-weight: 900; font-size: 22px; letter-spacing: 1px; }
#brand .sub { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.pill.live i { background: var(--up); }
.icon-btn { border: 1px solid var(--hair); background: var(--panel-solid); color: var(--ink); border-radius: 9px; height: 32px; padding: 0 10px; font: 500 12.5px var(--font-body); cursor: pointer; }
#settings { position: fixed; z-index: 6; top: calc(66px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); width: 280px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
#settings h2 { margin: 0; font-size: 12px; letter-spacing: 1.5px; color: var(--muted); font-weight: 700; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--chip); padding: 3px; border-radius: 10px; }
.seg button { border: 0; background: transparent; color: var(--ink); font: 500 12.5px var(--font-body); padding: 6px 2px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel-solid); box-shadow: 0 1px 3px rgba(0,0,0,.15); font-weight: 700; }
.time-row { display: flex; align-items: center; gap: 10px; }
.time-row input { flex: 1; accent-color: var(--focus); }
.time-row output { font: 700 14px var(--font-body); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.note { font-size: 11.5px; color: var(--muted); line-height: 1.55; }

/* replay HUD */
#hud { position: fixed; z-index: 5; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(calc(-50% - 200px)); width: 330px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
#hud .row { display: flex; justify-content: space-between; align-items: baseline; font-variant-numeric: tabular-nums; }
#hud .date { font: 700 20px var(--font-body); }
#hud .val { font: 700 18px var(--font-body); }
#hud canvas { width: 100%; height: 54px; display: block; }
#hud .legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); }
#hud .legend span::before { content: ""; display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; background: currentColor; }

/* chat dock */
#chat { position: fixed; z-index: 5; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 384px; display: flex; flex-direction: column; overflow: hidden; }
#chat header { padding: 12px 16px 10px; border-bottom: 1px solid var(--hair); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
#chat header b { font-size: 14px; }
#chat header span { font-size: 11.5px; color: var(--muted); }
#log { flex: 1; overflow-y: auto; padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
.msg { max-width: 92%; display: flex; flex-direction: column; gap: 4px; }
.msg.user { align-self: flex-end; }
.msg.user .body { background: var(--bubble); color: var(--bubble-ink); border-radius: 14px 14px 4px 14px; padding: 8px 12px; font-size: 14px; line-height: 1.55; }
.msg.bot { align-self: flex-start; }
.msg.bot .who { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.msg.bot .who i { width: 18px; height: 18px; border-radius: 6px; display: inline-grid; place-items: center; font-style: normal; font-size: 11px; color: #fff; background: #435369; }
.msg.bot .body { background: var(--panel-solid); border: 1px solid var(--hair); border-radius: 4px 14px 14px 14px; padding: 10px 12px; font-size: 14px; line-height: 1.7; }
.msg.bot .body b { font-variant-numeric: tabular-nums; }
.msg .src { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
details.trace { font-size: 12px; color: var(--muted); }
details.trace summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 2px 0; }
details.trace summary::-webkit-details-marker { display: none; }
details.trace summary::before { content: "▸"; font-size: 10px; }
details.trace[open] summary::before { content: "▾"; }
.trace .step { margin-top: 6px; }
.trace .step b { color: var(--ink); font-weight: 700; }
.trace pre { margin: 4px 0 0; background: var(--code-bg); border-radius: 8px; padding: 8px 10px; font: 11.5px/1.5 var(--font-mono); white-space: pre-wrap; word-break: break-all; color: var(--ink); max-height: 180px; overflow: auto; }
.ok { display: inline-block; background: color-mix(in srgb, var(--down) 18%, transparent); color: var(--down); border-radius: 6px; padding: 1px 7px; font-weight: 700; }
.typing { display: inline-flex; gap: 4px; padding: 12px 14px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
#chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px 4px; }
.chipq { border: 1px solid var(--hair); background: var(--panel-solid); color: var(--ink); border-radius: 999px; padding: 6px 11px; font: 13px var(--font-body); cursor: pointer; text-align: left; }
.chipq:hover { border-color: var(--focus); }
#ask { display: flex; gap: 8px; padding: 10px 14px 14px; }
#q { flex: 1; min-width: 0; border: 1px solid var(--hair); background: var(--panel-solid); color: var(--ink); border-radius: 10px; padding: 10px 12px; font: 14px var(--font-body); }
#send { border: 0; background: var(--bubble); color: var(--bubble-ink); border-radius: 10px; padding: 0 16px; font: 700 14px var(--font-body); cursor: pointer; }
#send:disabled { opacity: .5; cursor: default; }
#tip { position: fixed; z-index: 4; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: #fff; background: rgba(0,0,0,.38); padding: 5px 11px; border-radius: 999px; pointer-events: none; }

.lg { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.lg span::before { content: ""; display: inline-block; width: 14px; height: 4px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: middle; }
.api-row { display: flex; gap: 6px; }
.api-row input { flex: 1; min-width: 0; border: 1px solid var(--hair); background: var(--panel-solid); color: var(--ink); border-radius: 8px; padding: 6px 8px; font: 12.5px var(--font-body); }
#chat header > div { display: flex; flex-direction: column; gap: 2px; }
dialog#pf { border: 1px solid var(--hair); border-radius: 14px; padding: 0; background: var(--panel-solid); color: var(--ink); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 40px); }
dialog#pf::backdrop { background: rgba(0,0,0,.45); }
.pf-in { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.pf-head { display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
#pf table { width: 100%; border-collapse: collapse; }
#pf td { padding: 3px 4px; }
#pf select, #pf input[type=number] { width: 100%; border: 1px solid var(--hair); background: var(--panel-solid); color: var(--ink); border-radius: 8px; padding: 7px 8px; font: 13.5px var(--font-body); }
.pf-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.icon-btn.file { display: inline-flex; align-items: center; }
.icon-btn:disabled { opacity: .45; cursor: default; }
#pfCanvas { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--hair); touch-action: none; cursor: crosshair; }
button.link { border: 0; background: none; color: var(--focus); font: inherit; cursor: pointer; padding: 0 4px; }
button.primary { border: 0; background: var(--bubble); color: var(--bubble-ink); border-radius: 10px; padding: 10px 16px; font: 700 14px var(--font-body); cursor: pointer; }
@media (max-width: 760px) {
  #chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; }
  .chipq { flex: none; white-space: nowrap; }
  #ask { padding-top: 6px; }
  #chat { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 46%; border-radius: 16px 16px 0 0;
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  #chat header { display: none; }
  #hud { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; transform: none; bottom: auto; top: calc(66px + env(safe-area-inset-top, 0px)); padding: 8px 12px; gap: 3px; }
  #hud canvas { height: 34px; }
  #hud .legend { display: none; }
  #brand .sub { display: none; }
  #settings { width: auto; right: max(16px, env(safe-area-inset-right, 0px)); }
  #tip { display: none; }
}
@media (prefers-reduced-motion: reduce) { #log { scroll-behavior: auto; } .typing i { animation: none; } }
</style>

</head>
<body>
<div id="sky"></div>
<div id="stage" aria-label="ETF 都會 3D 城市"></div>

<div id="brand" class="panel">
  <div><h1>ETF 都會</h1><div class="sub" id="modeTxt">離線示範｜瀏覽器內的規則版 Agent</div></div>
  <span id="status" class="pill"><i></i><span>收盤</span></span>
  <button id="setBtn" class="icon-btn" type="button" aria-expanded="false" aria-controls="settings">城市設定</button>
</div>
<div id="settings" class="panel" hidden>
  <h2 id="h-scn">今日行情</h2>
  <div class="seg" role="group" aria-labelledby="h-scn">
    <button type="button" id="scn-real" data-scn="real" aria-pressed="false">真實</button>
    <button type="button" id="scn-mixed" data-scn="mixed" aria-pressed="true">震盪</button>
    <button type="button" id="scn-up" data-scn="up" aria-pressed="false">大漲</button>
    <button type="button" id="scn-flat" data-scn="flat" aria-pressed="false">平盤</button>
    <button type="button" id="scn-down" data-scn="down" aria-pressed="false">大跌</button>
  </div>
  <h2 id="h-time">時間</h2>
  <div class="time-row"><input id="time" type="range" min="8" max="22" step="0.25" value="14.5" aria-labelledby="h-time"><output id="timeOut" for="time">14:30</output></div>
  <label class="check"><input id="allLabels" type="checkbox"> 顯示所有大樓標籤</label>
  <div class="note" id="dataNote"></div>
  <h2>後端 (LLM Agent)</h2>
  <div class="api-row"><input id="apiUrl" placeholder="https://你的-space.hf.space" aria-label="後端網址"><button type="button" class="icon-btn" id="apiGo">連線</button></div>
  <div class="note" id="apiState"></div>
</div>

<div id="hud" class="panel" hidden aria-live="polite">
  <div class="row"><span class="date" id="hudDate">2020/01</span><span class="note" id="hudTitle">每月定期定額</span></div>
  <div class="row"><span class="note">投入 <b id="hudIn">0</b></span><span class="val" id="hudVal">0</span></div>
  <canvas id="hudChart" width="600" height="108"></canvas>
  <div class="legend"><span style="color:var(--muted)">投入本金</span><span id="hudLeg" style="color:var(--up)">市值</span></div>
</div>

<section id="chat" class="panel" aria-label="問城市">
  <header><div><b>問城市</b><span>點大樓或車站也能直接問</span></div><button type="button" class="icon-btn" id="pfBtn">我的持股</button></header>
  <div id="log" aria-live="polite"></div>
  <div id="chips"></div>
  <form id="ask" autocomplete="off">
    <input id="q" placeholder="例如：0056 跟 00878 差在哪？" aria-label="輸入問題">
    <button id="send" type="submit">問</button>
  </form>
</section>
<dialog id="pf" aria-labelledby="pfTitle">
  <form method="dialog" class="pf-in" onsubmit="return false">
    <div class="pf-head"><b id="pfTitle">我的持股</b><button type="button" class="icon-btn" id="pfClose">關閉</button></div>
    <p class="note">輸入每檔 ETF 的金額，或上傳券商 App 的庫存截圖讓模型讀取 (需要連上後端)。上傳後請先在圖上拖曳，把姓名、帳號塗黑；送出的是塗黑後的圖，伺服器不會存檔。</p>
    <table><tbody id="pfRows"></tbody></table>
    <div class="pf-actions"><button type="button" class="icon-btn" id="pfAdd">新增一列</button>
      <label class="icon-btn file">上傳截圖<input type="file" id="pfFile" accept="image/*" hidden></label>
      <button type="button" class="icon-btn" id="pfParse" disabled>辨識截圖</button></div>
    <p class="note" id="pfMaskHint" hidden>在圖上拖曳可以塗黑。<button type="button" class="link" id="pfUndo">復原一格</button></p>
    <canvas id="pfCanvas" hidden></canvas>
    <p class="note" id="pfNote"></p>
    <button type="button" id="pfGo" class="primary">計算穿透持股</button>
  </form>
</dialog>
<div id="tip">拖曳旋轉・滾輪縮放・點大樓直接問</div>

</script>

,"code":"2603","weight":4.37},{"name":"聯詠","code":"3034","weight":4.08},{"name":"聯電","code":"2303","weight":3.73},{"name":"瑞昱","code":"2379","weight":3.49},{"name":"華碩","code":"2357","weight":3.45},{"name":"中信金","code":"2891","weight":3.37},{"name":"聯發科","code":"2454","weight":3.13},{"name":"華南金","code":"2880","weight":3.09},{"name":"長榮航","code":"2618","weight":2.83},{"name":"陽明","code":"2609","weight":2.71}],"00878":[{"name":"聯詠","code":"3034","weight":6.61},{"name":"聯發科","code":"2454","weight":5.36},{"name":"華碩","code":"2357","weight":4.93},{"name":"聯電","code":"2303","weight":4.1},{"name":"瑞昱","code":"2379","weight":3.98},{"name":"日月光投控","code":"3711","weight":3.52},{"name":"中信金","code":"2891","weight":3.46},{"name":"世界","code":"5347","weight":3.34},{"name":"元大金","code":"2885","weight":3.23},{"name":"上海商銀","code":"5876","weight":3.2}],"00919":[{"name":"聯電","code":"2303","weight":10.39},{"name":"長榮","code":"2603","weight":10.38},{"name":"中信金","code":"2891","weight":9.94},{"name":"聯發科","code":"2454","weight":9.56},{"name":"聯詠","code":"3034","weight":8.73},{"name":"長榮航","code":"2618","weight":6.35},{"name":"世界","code":"5347","weight":4.66},{"name":"群聯","code":"8299","weight":2.75},{"name":"力成","code":"6239","weight":2.53},{"name":"瑞儀","code":"6176","weight":2.33}]}},"kb":[{"id":"bond-etf","title":"債券 ETF","summary":"持有一籃子債券的 ETF，價格主要受利率影響。","aliases":["債券ETF","債券","美債","公司債","存續期間"],"text":"# 債券 ETF\n\n## 一句話解釋\n\n債券 ETF 持有的是一籃子債券，收益主要來自債券利息，價格主要受利率影響。\n\n## 白話說明\n\n- 利率上升時，舊債券的價格會下跌；利率下降時，價格會上漲。\n- 存續期間越長 (通常是到期日越遠)，價格對利率變動越敏感。\n- 台灣常見的債券 ETF 多半投資海外債券，還要考慮匯率的影響。\n- 債券 ETF 的波動通常比股票 ETF 小，但不是保本商品。\n\n## 本系統的範圍\n\n城市裡目前只有台灣的股票型 ETF，沒有債券 ETF。","source":" (來源：專案自編，待核對)"},{"id":"city-guide","title":"城市怎麼看","summary":"ETF 都會的畫面說明：行政區、大樓、捷運路線、轉乘站各代表什麼。","aliases":["城市","怎麼看","大樓","捷運","轉乘站","行政區","煙火","下雨","鷹架","金色框"],"text":"# 城市怎麼看\n\n## 對應關係\n\n- 行政區是產業：半導體園區、電子科技區、金融區、航運港區、民生工業區。\n- 大樓是公司。樓高依這家公司在各檔 ETF 前十大中的最高權重，各檔的權重用標籤分開顯示。\n- 捷運路線是 ETF，車站是它的前十大成分股。\n- 兩條以上的路線都停的車站是轉乘站，代表這些 ETF 的前十大都有這家公司。\n- 大樓外觀是當天漲跌：漲越多窗戶越亮，大漲時頂樓放煙火；大跌時外牆龜裂、搭起鷹架。\n- 天氣是大盤：大盤下跌比較多時城市會下雨。\n- 金色框是你的持股穿透結果：框越高，代表你實際持有這家公司越多。\n\n## 怎麼操作\n\n可以直接打字發問，也可以點大樓或車站。回答的同時，畫面會移到相關的地方。","source":" (來源：專案自編的系統說明)"},{"id":"dca","title":"定期定額","summary":"每隔固定時間投入固定金額，分散進場時間點，但不保證獲利。","aliases":["定期定額","定時定額","DCA","每月扣款","存股"],"text":"# 定期定額\n\n## 一句話解釋\n\n定期定額是每隔固定時間 (例如每個月) 投入固定金額買進。\n\n## 白話說明\n\n- 因為每次金額固定，價格低的時候買到比較多單位，價格高的時候買到比較少，長期下來成本會被平均。\n- 它解決的是「不知道什麼時候進場」的問題，不需要預測高低點。\n- 它不保證賺錢。如果標的長期下跌，定期定額一樣會虧損，只是虧損的過程比較平緩。\n- 中途帳面出現虧損是正常的，能不能持續扣款往往比挑選進場時間更重要。\n\n## 本系統的算法\n\n回放功能假設每個月第一個交易日，用當天收盤價買進固定金額，可以買零股，不計手續費，報酬是價格報酬 (未含息)。\n\n## 常見誤解\n\n- 以為定期定額一定比單筆投入好。市場長期上漲時，早點單筆投入的報酬通常比較高，定期定額的優點是心理上比較容易執行。","source":" (來源：專案自編，待核對)"},{"id":"dividend-frequency","title":"配息頻率","summary":"ETF 可以年配、半年配、季配或月配，配息頻率不影響總報酬。","aliases":["配息頻率","月配","季配","半年配","年配","月配息"],"text":"# 配息頻率\n\n## 一句話解釋\n\n配息頻率是 ETF 多久發一次配息，常見的有年配、半年配、季配和月配。\n\n## 白話說明\n\n- 配息頻率寫在公開說明書裡，每檔 ETF 不同，例如市值型常見半年配，高股息型常見季配或月配。\n- 配息次數多不代表賺得多。同樣的收益，分成十二次或兩次發，總額是一樣的。\n- 配息頻率高的好處是現金流比較平均；缺點是配出去的錢不會留在基金裡繼續複利，再投入時也可能有交易成本。\n- 單筆配息金額較大時，可能需要負擔二代健保補充保費，實際規定以主管機關公告為準。\n\n## 常見誤解\n\n- 以為月配息 ETF 的殖利率一定比較高。殖利率要看全年配息總額和股價，和配幾次無關。","source":" (來源：專案自編，待核對)"},{"id":"ex-dividend","title":"除息與填息","summary":"除息當天股價會扣掉配息金額，之後漲回除息前的價格叫填息。","aliases":["除息","填息","貼息","除息日","填息天數"],"text":"# 除息與填息\n\n## 一句話解釋\n\n除息是把配息發給投資人，股價同步扣掉配息金額；之後股價漲回除息前的水準叫填息。\n\n## 白話說明\n\n- 除息日當天，ETF 的參考價會扣掉每單位配息，所以股價看起來下跌，但投資人另外拿到現金，資產總額沒有因為除息而改變。\n- 填息：除息後股價回到除息前一天的收盤價。沒有漲回去叫貼息，這時拿到的配息有一部分是自己的本金。\n- 要在除息日的前一個交易日收盤前持有，才能參加這次配息。\n- 只看股價走勢會低估配息多的 ETF，比較不同 ETF 時應該看含息的總報酬。\n\n## 本系統的限制\n\n目前的報酬都是價格報酬 (未含息)，配息多的 ETF 實際的總報酬會比顯示的數字高。\n\n## 常見誤解\n\n- 以為配息是多出來的錢。配息是從基金資產拿出來的，除息後淨值會等額減少。","source":" (來源：專案自編，待核對)"},{"id":"income-equalization","title":"收益平準金","summary":"ETF 配息時用來避免配息被新資金稀釋的機制，配息有一部分可能來自收益平準金。","aliases":["收益平準金","平準金","配息來源","配息組成"],"text":"# 收益平準金\n\n## 一句話解釋\n\n收益平準金是 ETF 配息制度的一環，目的是讓配息不會因為基金規模快速變動而被稀釋。\n\n## 白話說明\n\n- ETF 短時間內有大額申購、規模快速成長時，新加入的資金會分走原本投資人已經累積的收益。收益平準金就是用來避免這種稀釋，讓配息分配比較公平。\n- 收益平準金和 ETF 其他資產一樣，是投資在成分股裡，不會影響資金運用。\n- 金管會要求投信訂定動用原則：配息原則上要優先用股利、利息和已實現的資本利得，符合特定條件才能動用收益平準金。\n- 投信公告配息時，要同時揭露股利、利息、已實現資本利得和收益平準金各占多少；公開說明書和行銷資料也要標示「基金之配息來源可能為收益平準金」。\n\n## 常見誤解\n\n- 以為月配、季配就代表固定配息。任何配息機制都不保證固定配息。\n- 以為配息是多賺的錢。配息會從基金淨值中扣除，單次配息不等於完整的投資報酬。\n\n## 在城市裡\n\n台灣的高股息 ETF (例如 0056、00878、00919) 都有配息，可以搭配配息組成和總報酬一起看。","source":" (來源：經濟日報報導證交所說明 (2026-01-30))"},{"id":"index-rebalance","title":"成分股定期審核與調整","summary":"ETF 追蹤的指數會定期審核並更換成分股，ETF 也會跟著換股。","aliases":["成分股調整","換股","定期審核","汰換","納入","剔除","指數調整"],"text":"# 成分股定期審核與調整\n\n## 一句話解釋\n\n指數公司會依規則定期檢查成分股，把不符合條件的換掉，ETF 再跟著調整持股。\n\n## 白話說明\n\n- 每檔 ETF 追蹤的指數都有自己的選股規則和審核時間，例如每季或每半年審核一次，實際日期以指數編製規則為準。\n- 市值型指數的成分股通常變動不大；高股息指數依殖利率選股，每次審核可能換掉比較多檔。\n- 換股會產生交易成本，也可能讓 ETF 短時間內大量買賣特定股票。\n- 想知道一檔 ETF 現在持有什麼，要看投信公布的最新持股，不是指數剛成立時的名單。\n\n## 在城市裡\n\nETF 換股就像捷運路線改道：新的車站開通，舊的車站停駛。要做出這個效果需要保留不同日期的成分股資料。","source":" (來源：專案自編，待核對)"},{"id":"leveraged-inverse","title":"槓桿型與反向型 ETF","summary":"追蹤指數單日報酬的倍數或反向，適合短期交易，不適合長期持有。","aliases":["槓桿","反向","正2","反1","槓桿型","反向型","槓反"],"text":"# 槓桿型與反向型 ETF\n\n## 一句話解釋\n\n槓桿型 ETF 追求指數「單日」報酬的倍數，反向型 ETF 追求指數「單日」報酬的相反。\n\n## 白話說明\n\n- 重點是單日。這類 ETF 每天都會重新調整部位，所以持有超過一天，累積報酬不會剛好等於指數累積報酬的倍數。\n- 市場來回震盪時，就算指數最後回到原點，槓桿型和反向型 ETF 的淨值也可能下跌。\n- 它們用期貨等衍生性商品達到槓桿或反向的效果，成本比一般 ETF 高。\n- 這類商品是給熟悉風險的人做短期操作用的，券商會要求投資人具備一定條件才能交易。\n\n## 本系統的範圍\n\n城市裡目前只有一般的股票型 ETF，沒有槓桿型和反向型。","source":" (來源：專案自編，待核對)"},{"id":"market-cap-vs-high-dividend","title":"市值型與高股息型 ETF","summary":"市值型依公司市值決定權重，高股息型依殖利率等條件選股，兩者的成分股和報酬來源不同。","aliases":["市值型","高股息","高股息型","高息","大盤型","市值型跟高股息"],"text":"# 市值型與高股息型 ETF\n\n## 一句話解釋\n\n市值型 ETF 依公司市值大小決定成分股和權重；高股息型 ETF 依殖利率等條件選股。\n\n## 白話說明\n\n- 市值型 (例如 0050、006208)：追蹤的指數挑選市值最大的公司，市值越大權重越高，所以台積電在前十大中的權重特別高，整體表現很接近大盤。\n- 高股息型 (例如 0056、00878、00919)：指數依預估或過去的殖利率、配息穩定度等條件選股，成分股比較分散，配息通常比較多。\n- 報酬來源不同：市值型主要來自股價成長；高股息型有比較多的報酬來自配息，所以只看股價會低估它，要看含息的總報酬。\n- 兩種沒有絕對的好壞，差別在投資人想要的是現金流還是長期成長，以及能不能接受持股集中在少數大型公司。\n\n## 常見誤解\n\n- 以為高股息 ETF 比較安全。它一樣是股票，大盤下跌時也會跌。\n- 以為同時買一檔市值型和一檔高股息型就完全分散。兩者的成分股仍可能重疊，可以用前十大重疊權重來看。\n\n## 在城市裡\n\n把 0050 和 0056 兩條線同時顯示，可以看到它們走的路大部分不同。","source":" (來源：專案自編，待核對)"},{"id":"no-advice","title":"本系統不做的事","summary":"不預測漲跌、不推薦標的、不提供買賣建議，只說明可以查證的資料。","aliases":["投資建議","預測","明牌","推薦","免責"],"text":"# 本系統不做的事\n\n## 原則\n\n- 不預測股價或大盤的漲跌。\n- 不推薦買哪一檔，也不說哪一檔比較好。\n- 不建議買進或賣出的時間，不鼓勵借錢或使用槓桿投資。\n\n## 會做的事\n\n- 說明 ETF 的觀念和名詞。\n- 用程式計算過去的報酬、成分股重疊、定期定額的歷史結果、持股穿透。\n- 每個數字都附上資料來源和日期。\n\n## 提醒\n\n過去的績效不代表未來的表現。投資前請閱讀公開說明書，並依自己的狀況判斷。","source":" (來源：專案自編的系統說明)"},{"id":"odd-lot","title":"零股交易","summary":"不足一張 (一千單位) 的交易，讓小額資金也能買 ETF。","aliases":["零股","零股交易","盤中零股","一張","小額"],"text":"# 零股交易\n\n## 一句話解釋\n\nETF 一張是一千個單位，不足一張的買賣就是零股交易。\n\n## 白話說明\n\n- 零股讓投資人可以用比較少的錢買 ETF，定期定額多半就是買零股。\n- 盤中和盤後都可以交易零股，撮合方式和整張的交易不同，成交速度可能比較慢。\n- 零股的成交量通常比整張少，冷門的 ETF 可能有比較大的買賣價差。\n- 手續費依券商規定計算，很多券商有最低手續費，金額太小時手續費的比例會偏高。\n\n## 本系統的算法\n\n定期定額回放假設可以買零股，而且不計手續費。","source":" (來源：專案自編，待核對)"},{"id":"overlap","title":"持股重疊與分散","summary":"兩檔 ETF 持有相同的公司越多，同時持有的分散效果越小。","aliases":["重疊","持股重疊","重複持有","分散","重疊權重","共同持股","轉乘站"],"text":"# 持股重疊與分散\n\n## 一句話解釋\n\n持股重疊是兩檔 ETF 都持有同一家公司。重疊越多，同時買兩檔的分散效果越小。\n\n## 本系統的算法\n\n- 共同持股家數：兩檔 ETF 的前十大成分股中，相同的公司有幾家。\n- 重疊權重：每家共同持股取兩檔中比較小的權重，全部加起來。例如某公司在甲 ETF 占 5%、在乙 ETF 占 3%，這家公司的重疊權重算 3%。\n- 這兩個數字的意義不同：家數多但權重都很小，重疊其實有限；家數少但有一家權重很高，重疊可能很大。\n- 目前只有前十大成分股的資料，所以結果是「前十大」的重疊，不是完整持股的重疊。\n\n## 穿透持股\n\n把每檔 ETF 的投入金額乘上成分股權重再加總，可以估計自己實際持有各家公司的比例。很多人以為買了好幾檔 ETF 就已經分散，拆開來看才發現大部分的錢集中在同一家公司。\n\n## 在城市裡\n\n兩條捷運線都停的車站叫轉乘站，就是共同持股。","source":" (來源：專案自編的系統說明)"},{"id":"return-calc","title":"報酬的算法","summary":"本系統的區間報酬與年化報酬怎麼算，以及價格報酬和總報酬的差別。","aliases":["報酬率","價格報酬","年化報酬","含息","未含息","總報酬","還原"],"text":"# 報酬的算法\n\n## 一句話解釋\n\n本系統目前顯示的都是價格報酬，也就是只看股價變化，沒有把配息加回來。\n\n## 本系統的算法\n\n- 區間報酬：期末收盤價除以期初收盤價再減一。期初如果不是交易日，取之前最近的一個交易日。\n- 年化報酬：把一年以上的累積報酬換算成平均每年的複利報酬。\n- 所有數字都由程式依價格資料計算，語言模型只負責說明，回答中的數字是用編號填入的。\n\n## 價格報酬和總報酬\n\n- 總報酬是把配息加回去之後的報酬，比價格報酬高。\n- 配息越多的 ETF，兩者的差距越大，所以用價格報酬比較高股息型和市值型 ETF，會低估高股息型。\n- 等配息資料整理完成後，系統才會提供含息的報酬。\n\n## 股票分割\n\nETF 分割 (例如一拆四) 會讓股價變成原來的幾分之一，但持有的單位數變多，資產不變。計算報酬前，價格要先換算成同一個基準。","source":" (來源：專案自編的系統說明)"},{"id":"size-liquidity","title":"規模與流動性","summary":"ETF 規模太小可能下市，成交量太低則不容易用合理的價格買賣。","aliases":["規模","流動性","成交量","下市","清算","受益人數"],"text":"# 規模與流動性\n\n## 一句話解釋\n\n規模是 ETF 管理的資產總額，流動性是容不容易用合理的價格買賣。\n\n## 白話說明\n\n- 規模太小的 ETF，固定成本分攤到每單位比較高，也可能因為規模低於門檻而清算下市。下市時投資人會依當時的淨值拿回資金，不會歸零。\n- 流動性不好的 ETF，買賣價差比較大，市價也比較容易偏離淨值，出現折溢價。\n- 受益人數可以當作參考，但人數多不代表適合自己。\n- 造市商會持續報出買價和賣價，協助維持流動性。","source":" (來源：專案自編，待核對)"},{"id":"split","title":"ETF 分割","summary":"把一個單位拆成多個單位，股價等比例降低，投資人的資產總額不變。","aliases":["分割","一拆四","拆分","受益權單位分割","0050分割"],"text":"# ETF 分割\n\n## 一句話解釋\n\n分割是把一個受益權單位拆成多個，股價等比例下降，投資人持有的單位數等比例增加，總資產不變。\n\n## 白話說明\n\n- 目的是降低每張的價格，讓小額投資人比較容易買整張，也可能提高流動性。\n- 0050 元大台灣50 在 2025 年 6 月進行一拆四的分割：股價除以 4、單位數乘以 4。2025/6/11 到 6/17 暫停交易，6/18 恢復交易。\n- 分割不是下跌。看歷史走勢時，如果價格資料沒有還原，分割當天會出現很大的落差，這是資料基準不同造成的。\n\n## 本系統的做法\n\n價格資料統一使用同一個基準；如果來源已經是還原後的價格，就不會再另外調整。","source":" (來源：口袋學堂整理的元大投信公告)"},{"id":"top10-limit","title":"前十大成分股的限制","summary":"只看前十大成分股無法代表整檔 ETF，重疊和穿透持股都是估計值。","aliases":["前十大","完整持股","成分股","持股明細","估計值"],"text":"# 前十大成分股的限制\n\n## 一句話解釋\n\n本系統目前只有每檔 ETF 的前十大成分股，所以和持股有關的結果都是估計值。\n\n## 白話說明\n\n- 一檔 ETF 可能有幾十檔成分股。市值型 ETF 的前十大權重合計比較高，高股息型比較分散，前十大合計可能不到一半。\n- 兩檔 ETF 在前十大以外也可能持有相同的公司，所以實際的重疊會比「前十大重疊」高。\n- 穿透持股只算得到前十大涵蓋的部分，系統會同時顯示涵蓋了多少比例的資金。\n- 完整的持股明細可以在各投信的網站查到。","source":" (來源：專案自編的系統說明)"},{"id":"wiki-active-vs-passive","title":"主動式與被動式 ETF","summary":"被動式 ETF 追蹤指數，主動式 ETF 由經理人主動選股調整，追求超越績效指標但不保證做到。","aliases":["主動式 ETF","被動式 ETF","主動式","被動式","active ETF","passive ETF","平衡型 ETF","績效指標"],"text":"# 主動式與被動式 ETF\n\n## 一句話解釋\n\n被動式 ETF 以追蹤指數 (代表一群股票整體表現的數字) 為目標；主動式 ETF 由基金經理人依公開說明書的投資目標與策略主動調整投資組合，目標是追求超越績效指標的機會 (來源: s04b)。\n\n## 白話說明\n\n證交所整理的三大差異 (來源: s04a)：\n\n| 面向 | 被動式 ETF | 主動式 ETF |\n|---|---|---|\n| 產品設計理念 | 追蹤某個指數，表現和指數一致 | 經理人做投資決策，追求超越指數、創造收益等特定成果 |\n| 需要的投資專業 | 依指數建立投資組合 | 依靠經理人與研究團隊的判斷，不受單一指數限制 |\n| 風險管理 | 跟著指數定期調整成分股 | 可以依市況調整，例如市況差時提高防禦性 |\n\n- 績效指標 (benchmark，用來比較表現的標準)：主動式 ETF 可以設定績效指標，有設定的話要在公開說明書揭露，並且每月申報淨值與績效指標的累計漲跌 (來源: s04b)。\n- 持股公布：主動式 ETF 沒有追蹤的指數，投資人要到投信網站查持股；持股在每個營業日算完淨值後公布，但經理人隔天就可以調整，所以盤中實際持股可能和公布的不同 (來源: s04b)。\n- 被動式平衡型 ETF：屬於被動式，追蹤的指數同時包含股票和債券，指數規則訂有固定的股債比例 (來源: s04b)。\n\n## 常見誤解\n\n- 以為主動式 ETF 一定比較會賺。證交所強調，主動式 ETF 不保證能超越績效指標、大盤或被動式 ETF，過去績效也不代表未來 (來源: s04b)。\n- 以為兩種一定有一種比較好。證交所表示主動式和被動式沒有絕對優劣，要看投資人自己的目標與風險承受度 (來源: s04b)。\n\n## 例子\n\n假設被動式 ETF 是照食譜做菜，食譜 (指數) 寫什麼就放什麼；主動式 ETF 則像主廚依當天的食材和判斷調整做法，可能做得比食譜好，也可能做得比較差。","source":" (來源：ETF 入門 Wiki (twl-Benchen/etf-wiki))"},{"id":"wiki-common-misconceptions","title":"新手常見誤解","summary":"總整理頁，連到各頁「常見誤解」段落，每項附一句摘要。","aliases":["常見誤解","迷思","新手誤解","錯誤觀念"],"text":"# 新手常見誤解\n\n## 一句話解釋\n\n這頁整理各頁「常見誤解」段落的重點，詳細說明請點連結 (來源: s02b, s03b, s04b, s05a)。\n\n## 白話說明\n\n以下每一列的正確觀念都來自各頁標註的來源 (來源: s02b, s03b, s04b, s05a)：\n\n| 誤解 | 正確觀念 | 詳見 |\n|---|---|---|\n| 買進之後就不用再付錢 | 持有期間內扣費用會持續從淨值扣除 (來源: s02b) | 內扣費用與費用率 |\n| ETF 是被動投資，不用看買進價格 | 追價買到高溢價，溢價收斂時可能虧損 (來源: s03b) | 折溢價 |\n| 主動式 ETF 一定比較會賺 | 不保證超越績效指標、大盤或被動式 ETF (來源: s04b) | 主動式與被動式 ETF |\n| 配息率高就是賺得多 | 要看總報酬率，價格下跌可能抵消配息 (來源: s05a) | 配息與總報酬 |\n| 月配息 ETF 每個月一定會配 | 實際配不配由投信依基金狀況決定 (來源: s05a) | 配息與總報酬 |","source":" (來源：ETF 入門 Wiki (twl-Benchen/etf-wiki))"},{"id":"wiki-creation-redemption","title":"申購買回與套利","summary":"利用初級市場的淨值和次級市場的市價之間的價差來套利，這個機制會把市價拉回淨值附近。","aliases":["套利","申購買回","套利機制","creation","redemption","arbitrage"],"text":"# 申購買回與套利\n\n## 一句話解釋\n\n同一個商品在兩個市場價格不同，就有一買一賣賺價差的套利機會，ETF 靠這個機制讓市價和淨值 (資產真正的價值) 維持接近 (來源: s03a)。\n\n## 白話說明\n\n- 溢價時 (市價高於淨值)：在初級市場用較低的淨值申購 ETF，再到次級市場用較高的市價賣出 (來源: s03a)。\n- 折價時 (市價低於淨值)：在次級市場用較低的市價買進 ETF，再到初級市場用較高的淨值買回，或換回一籃子股票賣掉 (來源: s03a)。\n- 這些交易會讓市價和淨值的差距縮小 (來源: s03a)。\n- 套利不一定有效：流動性不佳、發行額度達到上限時，沒辦法申購買回，折溢價就可能一直存在 (來源: s03a)；標的流動性不足或市場劇烈波動時，修正也會比較慢 (來源: s03b)。\n\n## 例子\n\n假設淨值 100 元、市價 102 元，套利者向投信用 100 元申購，再到市場上用 102 元賣出，賺 2 元價差；大家都這樣做，市場上賣的人變多，市價就會被壓回 100 元附近。","source":" (來源：ETF 入門 Wiki (twl-Benchen/etf-wiki))"},{"id":"wiki-dividend-and-total-return","title":"配息與總報酬","summary":"配息只是報酬的一部分，ETF 也不保證固定配息，證交所提醒看表現要看總報酬率。","aliases":["配息","配息率","殖利率","總報酬率","總報酬","月配","季配","高股息"],"text":"# 配息與總報酬\n\n## 一句話解釋\n\n證交所提醒，判斷 ETF 表現不能只看配息率，應該以總報酬率 (價格漲跌加上配息的整體報酬) 為原則 (來源: s05a)。\n\n## 白話說明\n\n- ETF 不是固定配息的商品，過去的配息率不代表未來的配息率 (來源: s05a)。\n- ETF 價格的變化，對總報酬率的影響也很大 (來源: s05a)。\n- 所謂月配或季配型 ETF，是投信每月或每季評估基金資產有沒有達到可分配收益的標準，實際配不配息，仍由投信依基金實際績效決定 (來源: s05a)。\n- 證交所也提醒，市場上的 ETF 廣告或推介常以誘人的收益或簡化的風險吸引人，投資人要分辨內容是否真實準確 (來源: s05a)。\n\n## 例子\n\n假設 A 一年配息 8%，但價格跌了 10%，總報酬是負的；B 一年只配 2%，價格漲了 5%，總報酬是正的。只看配息率會以為 A 比較好，看總報酬才知道結果相反。\n\n## 常見誤解\n\n- 以為配息率高就代表賺得多。配息只是報酬的一部分，價格下跌可能抵消甚至超過配息 (來源: s05a)。\n- 以為月配息 ETF 保證每個月都會配。實際配不配由投信依基金狀況決定 (來源: s05a)。","source":" (來源：ETF 入門 Wiki (twl-Benchen/etf-wiki))"},{"id":"wiki-etf-0050","title":"0050 元大台灣50","summary":"台灣第一檔 ETF，投資台灣上市市值最大的 50 家公司，2025 年改成依規模分級的費率。","aliases":["0050","元大台灣50","台灣50","元大投信","台灣卓越50"],"text":"# 0050 元大台灣50\n\n## 一句話介紹\n\n0050 是元大投信發行的 ETF，投資台灣上市市值最大的 50 家公司 (來源: s02a)。\n\n## 基本資料\n\n- 成立：2003 年 (來源: s02a)。\n- 規模：約 4,469 億元，截至 2025-01 (來源: s02a)。\n- 舊費率：經理費 0.32%、保管費 0.035%，2025-01-24 之前適用 (來源: s02a)。\n- 新費率 (2025-01-24 起) 依規模分段計算，截至 2025-01 (來源: s02a)：\n\n| 規模區間 | 經理費 | 保管費 |\n|---|---|---|\n| 1,000 億元以下 | 0.15% | 0.03% |\n| 逾 1,000 億到 5,000 億元 | 0.10% | 0.03% |\n| 逾 5,000 億到 1 兆元 | 0.08% | 0.03% |\n| 逾 1 兆元 | 0.05% | 0.025% |\n\n- 以 2025-01 的規模估算，新制的經理費約 0.11%、保管費約 0.03% (來源: s02a)。\n- 另一份 2022 年的資料寫 0050 內扣費用率約 0.46%，這是調降前的舊數字，截至 2022-07 (來源: s02b)。\n\n## 和哪些概念有關\n\n- 內扣費用與費用率\n- 指數與追蹤","source":" (來源：ETF 入門 Wiki (twl-Benchen/etf-wiki))"},{"id":"wiki-etf-risks","title":"ETF 的風險","summary":"證交所列出的 ETF 主要風險：折溢價、流動性、追蹤誤差、市場、集中度與下市風險。","aliases":["風險","ETF 風險","投資風險","下市","流動性風險","集中度風險"],"text":"# ETF 的風險\n\n## 一句話解釋\n\nETF 分散投資一籃子股票，但不代表沒有風險，證交所列出的主要風險有六種 (來源: s05a)。\n\n## 白話說明\n\n證交所提到的六種風險如下 (來源: s05a)：\n\n| 風險 | 白話意思 | 延伸閱讀 |\n|---|---|---|\n| 折溢價風險 | 用比淨值高很多的價格買進 | 折溢價 |\n| 流動性風險 | 想買賣的時候不容易成交 | 申購買回與套利 |\n| 追蹤誤差 | ETF 表現和指數有落差 | 追蹤誤差 |\n| 市場風險 | 整個市場下跌，ETF 也跟著跌 | |\n| 集中度風險 | 投資集中在少數股票或產業 | |\n| 下市風險 | ETF 終止上市 | |\n\n- 證交所提醒，投資前要詳閱公開說明書，評估自己的需求、目標與風險承受度 (來源: s05a)。\n- 主動式和被動式 ETF 都有折溢價風險，市價和淨值落差大時可能承受價差損失 (來源: s04b)。\n- 在市場情緒高漲時追價，可能在價格偏離基本價值時進場，承擔不必要的溢價風險 (來源: s03b)。\n\n## 例子\n\n假設一檔 ETF 只投資某一個產業，當那個產業整體表現不好時，就算 ETF 裡有幾十家公司，也可能一起下跌，這就是集中度風險。","source":" (來源：ETF 入門 Wiki (twl-Benchen/etf-wiki))"},{"id":"wiki-etf-ticker-codes","title":"ETF 代碼與簡稱怎麼看","summary":"從基金名稱、證券簡稱和代碼第六碼，可以分辨主動式 ETF (A/D) 和被動式平衡型 ETF (T)。","aliases":["ETF 代碼","證券代碼","第六碼","簡稱","主動","平衡","A","D","T"],"text":"# ETF 代碼與簡稱怎麼看\n\n## 一句話解釋\n\n證交所規定可以用「基金名稱」「證券簡稱」「證券代碼」三個地方分辨主動式 ETF (由經理人主動操作的 ETF) 和被動式平衡型 ETF，截至 2025-01 (來源: s04b)。\n\n## 白話說明\n\n證交所說明的分辨方式如下 (來源: s04b)：\n\n| 類型 | 基金名稱 | 證券簡稱前兩字 | 代碼第六碼 |\n|---|---|---|---|\n| 主動式股票 ETF | 含「主動式」 | 主動 | A |\n| 主動式債券 ETF | 含「主動式」 | 主動 | D |\n| 被動式平衡型 ETF | (無特別規定) | 平衡 | T |\n\n## 例子\n\n假設你看到一檔 ETF 的代碼是六碼、最後一碼是 A，簡稱又以「主動」開頭，就可以判斷它是主動式股票 ETF。","source":" (來源：ETF 入門 Wiki (twl-Benchen/etf-wiki))"},{"id":"wiki-expense-ratio","title":"內扣費用與費用率","summary":"持有 ETF 期間的經理費、保管費等費用，直接從淨值裡扣除，不會另外寄帳單給你。","aliases":["內扣費用","費用率","經理費","保管費","expense ratio","管理費"],"text":"# 內扣費用與費用率\n\n## 一句話解釋\n\n內扣費用是 ETF 本身要付的經理費、保管費等費用，直接從基金的淨值 (一籃子資產真正的價值) 中扣除 (來源: s02b)。\n\n## 白話說明\n\n- 投資人不會收到內扣費用的帳單，但它每天都從淨值裡扣，所以會讓報酬變少 (來源: s02b)。\n- 費用率以「一年多少 %」表示 (來源: s02b)。\n- 經理費是付給管理基金的投信，保管費是付給保管基金資產的銀行 (來源: s02a)。\n- 有些 ETF 採分級費率：基金規模越大，超過門檻的那部分費率越低，例如 0050 從 2025-01-24 起的新制 (來源: s02a)。\n- 追蹤同一個指數的不同 ETF，費用率可能不一樣，比較時可以把費用率當成一項參考數字 (來源: s02b)。\n\n## 例子\n\n假設兩檔 ETF 追蹤同一個指數，一檔費用率 0.5%、另一檔 0.1%，在其他條件都一樣的情況下，持有越久，兩者扣掉的費用差距就越大。\n\n## 常見誤解\n\n- 以為買進之後就不用再付錢。其實只要持有，內扣費用就會持續從淨值中扣除 (來源: s02b)。","source":" (來源：ETF 入門 Wiki (twl-Benchen/etf-wiki))"},{"id":"wiki-index-tracking","title":"指數與追蹤","summary":"指數代表一群股票的整體表現，被動式 ETF 依照指數的成分股和比重買進，讓表現貼近指數。","aliases":["指數","追蹤指數","成分股","index","指數化投資"],"text":"# 指數與追蹤\n\n## 一句話解釋\n\n被動式 ETF 的做法是照著某個指數的成分股與比重持有股票，讓 ETF 的表現緊貼指數 (來源: s01a)。\n\n## 白話說明\n\n- 指數的成分股 (被選進指數的那些股票)，就是 ETF 的投資組合 (來源: s01a)。\n- ETF 的重點是追蹤指數，不是打敗指數，所以投信會把持股調整到和指數成分股一致 (來源: s01a)。\n- 追蹤得好的 ETF，表現會很接近指數 (來源: s01a)。\n- 這種以追蹤指數為目標的 ETF 稱為被動式 ETF；另外還有由經理人主動選股的主動式 ETF (不追蹤指數、追求超越績效指標) (來源: s04b)。\n\n## 例子\n\n假設一個指數裡 A 公司占 30%、B 公司占 70%，追蹤它的 ETF 也會盡量把錢依 30% 和 70% 分配到這兩家公司。","source":" (來源：ETF 入門 Wiki (twl-Benchen/etf-wiki))"},{"id":"wiki-nav","title":"淨值","summary":"ETF 持有的一籃子資產真正值多少錢，是判斷市價合不合理的基準。","aliases":["淨值","NAV","資產淨值","基金淨值","真實價值"],"text":"# 淨值\n\n## 一句話解釋\n\n淨值是 ETF 所持有資產的真實價值，證交所說明 ETF 的合理價格應該以淨值為基礎 (來源: s03a, s03b)。\n\n## 白話說明\n\n- ETF 在市場上的買賣價格叫市價，由買賣雙方的供需決定，不一定等於淨值 (來源: s03a)。\n- 淨值是 ETF 所有持股加起來的總價值 (來源: s02b)。\n- 市價和淨值的差距，就是折溢價 (市價比淨值高或低多少) (來源: s03a)。\n- 證交所提醒，交易前可以先查投信官網上的即時淨值，判斷市價是否合理 (來源: s03b)。\n\n## 例子\n\n假設一個 ETF 裡的股票全部加起來，換算成每一單位值 100 元，這 100 元就是淨值；同一時間市場上有人用 101 元成交，101 元就是市價。","source":" (來源：ETF 入門 Wiki (twl-Benchen/etf-wiki))"},{"id":"wiki-premium-discount","title":"折溢價","summary":"市價和淨值的落差，市價比較高叫溢價，比較低叫折價。","aliases":["折價","溢價","折溢價","premium","discount","溢價率"],"text":"# 折溢價\n\n## 一句話解釋\n\nETF 的市價高於淨值 (資產真正的價值) 叫溢價，市價低於淨值叫折價 (來源: s03a)。\n\n## 白話說明\n\n- 為什麼會有落差：市價由市場供需決定，需求大於供給時市價會高於淨值，形成溢價；需求小於供給時則形成折價 (來源: s03a)。\n- 證交所 2026 年的參考範圍：流動性好、透明度高的 ETF，折溢價通常在 0.5% 以內；持續超過 3% 已明顯偏離合理區間；達到 5% 以上要格外小心，截至 2026-05 (來源: s03b)。\n- 落差通常會被申購買回的套利 (利用兩邊價差賺錢的交易) 拉回來，但市場供需失衡、短期情緒、海外市場休市、成分股流動性不足時，偏離可能持續一段時間 (來源: s03b)。\n- 追蹤效果好的 ETF，不會有很大的折溢價 (來源: s01a)。\n\n## 例子\n\n假設淨值是 100 元，市價是 103 元，溢價就是 3%；如果市價是 98 元，折價就是 2%。\n\n## 常見誤解\n\n- 以為 ETF 是被動投資工具，就不用看買進價格。證交所提醒，在市場情緒高漲時追價買進高溢價的 ETF，等溢價收斂後，就算資產價格沒有下跌，投資人也可能出現損失，溢價本身就是一種容易被忽略的隱形成本 (來源: s03b)。","source":" (來源：ETF 入門 Wiki (twl-Benchen/etf-wiki))"},{"id":"wiki-primary-secondary-market","title":"初級市場與次級市場","summary":"初級市場是大額向投信用淨值申購或買回，次級市場是一般人用證券帳戶以市價買賣。","aliases":["初級市場","次級市場","一級市場","二級市場","申購","買回"],"text":"# 初級市場與次級市場\n\n## 一句話解釋\n\nETF 掛牌後有兩種交易管道：次級市場用市價像股票一樣買賣，初級市場則是用淨值 (資產真正的價值) 向發行的投信大額申購或買回 (來源: s03a)。\n\n## 白話說明\n\n- 次級市場：投資人用原本的證券帳戶，以市價下單買賣 ETF，和買賣股票一樣 (來源: s03a)。\n- 初級市場：依淨值向發行公司申購 (拿錢或一籃子股票換 ETF) 或買回 (拿 ETF 換回錢或股票) (來源: s03a)。\n- 初級市場有很高的最低交易單位，例如 0050 的基本單位是 500 張，金額達數千萬元，所以一般投資人通常沒辦法在初級市場套利，主要在次級市場買賣 (來源: s02b)。\n\n## 例子\n\n假設你用手機下單買 1 張 ETF，你是在次級市場跟其他投資人買；只有大型機構一次要買非常大量時，才會直接找投信申購。","source":" (來源：ETF 入門 Wiki (twl-Benchen/etf-wiki))"},{"id":"wiki-tracking-error","title":"追蹤誤差","summary":"ETF 實際報酬和它追蹤的指數報酬之間的差距，主因是費用和調整持股的成本。","aliases":["追蹤誤差","tracking error","追蹤差異"],"text":"# 追蹤誤差\n\n## 一句話解釋\n\n追蹤誤差是指數的報酬和 ETF 實際報酬之間的差距，兩者幾乎不可能完全一樣 (來源: s02b)。\n\n## 白話說明\n\n造成差距的常見原因 (來源: s02b)：\n\n- 指數只是一個計算出來的數字，不用付錢；ETF 要付經理費等內扣費用 (從淨值裡扣的管理費用) (來源: s02b)。\n- 指數換成分股不用成本，ETF 換股要實際買賣，有交易成本，時間和價格也可能和指數不同 (來源: s02b)。\n- 流動性不好或交易受限制時，ETF 可能沒辦法照指數即時調整 (來源: s02b)。\n- 為了配息而保留現金，也會造成差距 (來源: s02b)。\n\ns02b 提出的一種觀察方式：拿「指數報酬減 ETF 報酬」的差距和費用率比較，差距明顯大於費用率 (例如兩倍以上) 或持續擴大，可能代表追蹤效果不好 (來源: s02b)。\n\n## 例子\n\n假設某年指數漲 10%，追蹤它的 ETF 只漲 9.7%，中間 0.3% 的差距就是追蹤誤差。","source":" (來源：ETF 入門 Wiki (twl-Benchen/etf-wiki))"},{"id":"wiki-trading-costs","title":"交易成本：手續費與證交稅","summary":"買賣 ETF 時要付券商手續費，賣出時另付證券交易稅，和持有期間的內扣費用是兩回事。","aliases":["手續費","證交稅","證券交易稅","交易稅","交易成本","券商手續費"],"text":"# 交易成本：手續費與證交稅\n\n## 一句話解釋\n\n交易成本是每次買賣 ETF 時才會付的錢，包含券商手續費和賣出時的證券交易稅 (來源: s02b)。\n\n## 白話說明\n\n- 券商手續費：在台灣買和賣各收一次，費率 0.1425%，券商通常會給折扣，截至 2022-07 (來源: s02b)。\n- 證券交易稅 (證交稅)：賣出時由政府收取，台灣股票型 ETF 的稅率是 0.1%，截至 2022-07 (來源: s02b)。\n- 一般股票的證交稅是千分之三 (0.3%)，比 ETF 的 0.1% 高，截至 2025-01 (來源: s06a, s02b)。\n- 以債券為主要投資標的的債券 ETF，從 2017-01-01 到 2026-12-31 暫停徵收證交稅，槓桿型與反向型不適用，期限過後是否延長要以財政部最新公告為準 (來源: s06a)。\n- 交易成本只有在買賣時發生；持有期間另外有內扣費用 (從淨值裡扣的管理費用) (來源: s02b)。\n\n## 例子\n\n假設你一個月內買進又賣出同一檔 ETF 好幾次，每一次都要付手續費，賣出還要付證交稅，買賣越頻繁，交易成本累積得越多。","source":" (來源：ETF 入門 Wiki (twl-Benchen/etf-wiki))"},{"id":"wiki-twse","title":"臺灣證券交易所","summary":"臺灣的證券交易所，ETF 在這裡掛牌交易，也發布 ETF 相關的投資人提醒。","aliases":["證交所","TWSE","臺灣證交所","台灣證券交易所"],"text":"# 臺灣證券交易所\n\n## 一句話介紹\n\n臺灣證券交易所 (簡稱證交所) 是 ETF 掛牌買賣的交易所，ETF 的正式中文名稱「指數股票型基金」就是證交所的用語 (來源: s01a)。\n\n## 基本資料\n\n- 證交所網站 (www.twse.com.tw) 有 ETF 系列專題報導和「ETF e添富」專欄，說明折溢價等觀念 (來源: s03a, s03b)。\n- ETF 在證交所掛牌，買賣方式和上市股票一樣 (來源: s01a)。\n\n## 和哪些概念有關\n\n- 什麼是 ETF\n- 折溢價","source":" (來源：ETF 入門 Wiki (twl-Benchen/etf-wiki))"},{"id":"wiki-what-is-etf","title":"什麼是 ETF","summary":"ETF 是在交易所像股票一樣買賣、追蹤某個指數的基金，正式名稱是指數股票型基金。","aliases":["ETF","Exchange Traded Fund","指數股票型基金","交易所交易基金"],"text":"# 什麼是 ETF\n\n## 一句話解釋\n\nETF 是 Exchange Traded Fund 的縮寫，意思是在交易所買賣的基金，臺灣證券交易所給它的正式名稱是「指數股票型基金」(來源: s01a)。\n\n## 白話說明\n\n這個正式名稱可以拆成三個詞來看 (來源: s01a)：\n\n- **指數**：ETF 會追蹤某個指數 (代表一群股票整體表現的數字)，目標是貼近指數，不是打敗指數 (來源: s01a)。\n- **股票**：ETF 在交易所掛牌，買賣方式和股票一樣 (來源: s01a)。\n- **基金**：ETF 由投信 (證券投資信託公司，專門管理基金的公司) 發行與管理，把一籃子股票切成很多小單位賣給投資人 (來源: s01a)。\n\n因為是一籃子股票，買一個單位的 ETF，就等於同時持有指數裡所有成分股的一小部分 (來源: s01a)。\n\n## 例子\n\n假設有一個指數由 50 家公司組成，你想自己把 50 家都買齊，需要很多錢；買一個追蹤這個指數的 ETF，用比較少的錢就能一次擁有這 50 家公司的一小部分。","source":" (來源：ETF 入門 Wiki (twl-Benchen/etf-wiki))"}]};

  CO[n] = { name: n, code: c.code, d: c.district, ind: c.industry, kind, etfs, maxW, H: 4 + 5.2 * Math.sqrt(maxW), sign: st.sign || n, crane: !!st.crane,

// 自動配置：每個行政區依公司數量排成格子；晶圓廠、貨櫃場、機場占地較大，另外處理
function layoutDistrict(dk) {
  const list = Object.values(CO).filter(c => c.d === dk).sort((a, b) => b.maxW - a.maxW); if (!list.length) return;
  const [W, D] = DIST[dk].s, put = (c, x, z, f) => { c.lot = [x, z]; c.fp = [f, f]; };
  let rest = list, slots = [];
  const fab = list.find(c => c.kind === 'fab');
  if (fab) {
    put(fab, -3.5, -3.5, 7); rest = list.filter(c => c !== fab);
    slots = [[5.4, -6.6, 4.4], [10.4, -6.6, 4.2], [5.4, 0, 4.2], [10.4, 0, 4], [5.4, 6.6, 4], [10.4, 6.6, 4], [-10.6, -7.2, 3.6], [-10.6, -1.6, 3.4]];
  } else if (dk === 'port') {
    const ships = list.filter(c => c.kind === 'ship'), airs = list.filter(c => c.kind === 'air');
    const zs = ships.length <= 2 ? [-5, 4.5] : [-6.6, 0, 6.6];
    ships.slice(0, 3).forEach((c, i) => put(c, -8, zs[i], 4.5));
    airs.slice(0, 1).forEach(c => put(c, 6, ships.length > 2 ? -4 : 0, 4));
    rest = list.filter(c => !c.lot); rest.forEach(c => { c.kind = 'tech'; });
    slots = [[8.5, -7, 3.6], [8.5, 7, 3.6], [3, -7.2, 3.4], [-1, 7.4, 3.4]];
  }
  if (!slots.length) {
    const n = rest.length, cols = n <= 4 ? 2 : n <= 9 ? 3 : 4, rows = Math.ceil(n / cols), cw = (W - 2) / cols, cd = (D - 2) / rows;
    for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) slots.push([-(W - 2) / 2 + cw * (q + 0.5), -(D - 2) / 2 + cd * (r + 0.5) - 0.6, Math.min(cw - 2.6, cd - 4.2, 6)]);
  }
  rest.forEach((c, i) => { const s = slots[i % slots.length]; const f = Math.max(3.2, Math.min(s[2], 3.4 + 0.55 * Math.sqrt(c.maxW))); put(c, s[0], s[1], c.kind === 'telecom' ? Math.min(f, 4) : f); });
}

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ================= writer check (reflection: numbers must come from tools) ================= */
function numberCheck(html, results) {
  const txt = html.replace(/<[^>]+>/g, '').replace(/「[^」]*」/g, '');
  const found = [...txt.matchAll(/([+-]?\d[\d,]*(?:\.\d+)?)\s*(%|元(?!大)|萬)/g)];
  const vals = [];
  const walk = o => { if (typeof o === 'number') vals.push(o); else if (Array.isArray(o)) o.forEach(walk); else if (o && typeof o === 'object') for (const [k, v] of Object.entries(o)) if (!k.startsWith('_')) walk(v); };
  results.forEach(r => { walk(r.result); walk(r.args); });
  const docText = results.map(r => (r.result && r.result._raw) || '').join(' ').replace(/,/g, '');
  const bad = [];
  for (const m of found) {
    const s = m[1].replace(/[+,]/g, ''), d = m[2] === '萬' ? 0 : (s.split('.')[1] || '').length;
    const x = (Math.abs(parseFloat(s)) * (m[2] === '萬' ? 10000 : 1)).toFixed(d);
    if (!vals.some(v => Math.abs(v).toFixed(d) === x || Math.abs(v * 100).toFixed(d) === x) && !docText.includes(s.replace(/^-/, ''))) bad.push(m[0]);
  }
  return { n: found.length, bad };
}

  replay = { k, sim, S, i: 0, acc: 0.3, step: reduce ? 0.02 : 0.11, msg, maxV: Math.max(...S.map(s => Math.max(s.val, s.inv))), top: Object.entries(ETFS[k].w).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([n]) => n) };
  for (const b of Object.values(B)) b.fx.visible = false;

    else if (a.name === 'show_portfolio') setMine({ _share: Object.fromEntries(Object.entries(g.shares || {}).filter(([n]) => CO[n])) });

/* ---------- label layout: keep labels from covering each other ---------- */
const _v = new THREE.Vector3();
function placeLabels(ls) {
  const wpp = VIEW / (innerHeight * camera.zoom), items = [];
  for (const b of Object.values(B)) if (b.label.visible) {
    const h = b.label.userData.h || 66, sy = h / 34 * ls, y0 = b.topY + 0.6 + sy / 2;
    b.label.scale.set(190 / 34 * ls, sy, 1);
    _v.set(b.group.position.x, b.group.position.y + y0, b.group.position.z).project(camera);
    items.push({ b, y0, px: (_v.x + 1) / 2 * innerWidth, py: (1 - _v.y) / 2 * innerHeight, w: 190 / 34 * ls / wpp, hh: sy / wpp });
  }
  items.sort((a, b) => b.py - a.py);
  const placed = [];
  for (const it of items) {
    let py = it.py;
    for (let pass = 0; pass < 3; pass++) for (const o of placed) if (Math.abs(it.px - o.px) < (it.w + o.w) / 2 - 6 && Math.abs(py - o.py) < (it.hh + o.hh) / 2 + 2) py = o.py - (it.hh + o.hh) / 2 - 2;
    const lift = (it.py - py) * wpp / 0.92;
    it.b.label.position.set(0, it.y0 + lift, 0); it.py = py; placed.push(it);
  }
}

/* ---------- loop ---------- */
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), T = clock.elapsedTime;
  if (fly) {
    fly.t += dt; const u = clamp(fly.t / fly.dur, 0, 1), k = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    controls.target.lerpVectors(fly.fromT, fly.toT, k); camera.position.copy(controls.target).add(fly.off);
    camera.zoom = lerp(fly.fromZ, fly.toZ, k); camera.updateProjectionMatrix();
    if (u >= 1) fly = null;
  }
  controls.update();
  const ls = (DESK() ? 135 : 96) * VIEW / (190 / 34 * innerHeight * camera.zoom);
  placeLabels(ls);
  for (const m of ringG.children) if (m.userData.pulse) { const f = ((T * 0.6 + m.userData.ph) % 1); m.scale.set(1 + f * 0.7, 1 + f * 0.7, 1); m.material.opacity = 0.85 * (1 - f); }
  if (replay) { replay.acc += dt; while (replay && replay.acc >= replay.step) { replay.acc -= replay.step; replayStep(); } }
  if (!reduce) {
    for (const L of Object.values(LINES)) for (const p of L.pulses) {
      p.userData.t = (p.userData.t + dt * 0.035) % 1;
      const f = p.userData.t * (L.sample.length - 1), i = Math.floor(f);
      p.position.copy(L.sample[i]).lerp(L.sample[Math.min(i + 1, L.sample.length - 1)], f - i).setY(0.62);
    }
    for (const car of cars) {
      const u = car.userData; u.t += u.dir * u.speed * dt; if (u.t > 75) u.t = -75; if (u.t < -75) u.t = 75;
      if (u.ns) car.position.set(u.lane, 0.08, u.t); else car.position.set(Math.min(u.t, 26) - 30, 0.08, 1 + u.lane);
    }
    if (rain.visible) {
      const a = rain.geometry.attributes.position.array;
      for (let i = 0; i < RAIN_N; i++) { const o = i * 6; let y = a[o + 1] - 55 * dt; if (y < 0) y += 70; a[o + 1] = y; a[o + 4] = y - 1.3; }
      rain.geometry.attributes.position.needsUpdate = true;
    }
    if (!replay) for (const b of Object.values(B)) if (b.boom) {
      b.nextBurst -= dt;
      if (b.nextBurst <= 0) { const p = b.group.position; spawnBurst(p.x + (Math.random() - 0.5) * 3, p.y + b.topY + 5 + Math.random() * 4, p.z + (Math.random() - 0.5) * 3); b.nextBurst = 0.9 + Math.random() * 1.4; }
    }
    for (let i = bursts.length - 1; i >= 0; i--) {
      const bu = bursts[i]; bu.life += dt;
      const a = bu.p.geometry.attributes.position.array;
      bu.vel.forEach((v, j) => { v.y -= 4.5 * dt; v.multiplyScalar(0.985); a[j * 3] += v.x * dt; a[j * 3 + 1] += v.y * dt; a[j * 3 + 2] += v.z * dt; });
      bu.p.geometry.attributes.position.needsUpdate = true;
      bu.p.material.opacity = Math.max(0, 1 - bu.life / 1.6);
      if (bu.life > 1.6) { scene.remove(bu.p); bu.p.geometry.dispose(); bu.p.material.dispose(); bursts.splice(i, 1); }
    }
    for (const b of Object.values(B)) if (b.crane) b.crane.rotation.y += dt * 0.08;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
